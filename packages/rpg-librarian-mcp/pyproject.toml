[project]
name = "rpg-librarian-mcp"
version = "0.1.0"
description = "MCP server for organizing a digital RPG archive"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastmcp>=3.0",
    "isbnlib>=3.10.14",
    "jinja2>=3.1",
    "litellm>=1.60",
    "lxml>=6.0",  # trimesh's 3mf loader lazily needs this; not pulled in transitively
    "mutagen>=1.48.1",
    "networkx>=3.5",  # trimesh's 3mf/scene-graph loader lazily needs this; not pulled in transitively
    "pebble>=5.2.1",
    "pillow>=12.3.0",
    "pymediainfo>=7.0.1",
    "pymupdf>=1.28.0",
    "pypdfium2>=5.12.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rpg-librarian-tools",
    "rich>=13.9",
    "scipy>=1.16.2",  # trimesh's convex-hull code (mesh.convex_hull, mesh.bounding_box) lazily needs this; not pulled in transitively
    "setuptools>=80.0,<82",  # isbnlib.registry does `from pkg_resources import ...`, removed in setuptools 82
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "trimesh>=4.12.2",
]

[project.scripts]
rpg-librarian-mcp = "rpg_librarian_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_librarian_mcp"]

[tool.uv.sources]
rpg-librarian-tools = { workspace = true }
