[project]
name = "rpg-librarian-tools"
version = "0.1.0"
description = "Stateless, atomic operations for RPG library processing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-barcode>=0.16.1",
    "python-magic>=0.4.27",
    "requests>=2.32",
    "zxing-cpp>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_librarian_tools"]
