# Hooks run through `uv run`, so ruff/ty/pytest versions come from the dev
# dependency group in pyproject.toml -- one place to bump, no drift between
# what CI, the hooks, and your shell run.
#
# Install once per clone:  uv run pre-commit install --install-hooks -t pre-commit -t pre-push
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-alembic-migrations
        name: Check Alembic migrations
        entry: uv run python scripts/check_migrations.py
        language: system
        pass_filenames: false
        always_run: true