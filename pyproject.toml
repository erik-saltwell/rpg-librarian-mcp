[project]
name = "rpg-librarian-mcp"
version = "0.1.0"
description = "MCP server for organizing a digital RPG archive"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
rpg-librarian-mcp = "rpg_librarian_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_librarian_mcp"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.ty.environment]
root = ["./src", "./tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The sandbox denies writes under %TEMP%, where pytest puts tmp_path by
# default. Keep the temp root inside the project instead.
addopts = "--basetemp=.pytest-tmp"
