[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.ruff]
line-length = 88
src = [
    "packages/rpg-librarian-mcp/src",
    "packages/rpg-librarian-tools/src",
    "apps/rpg-librarian/src",
    "packages/rpg-librarian-mcp/tests",
    "packages/rpg-librarian-tools/tests",
    "apps/rpg-librarian/tests",
]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ty.environment]
root = [
    "./packages/rpg-librarian-mcp/src",
    "./packages/rpg-librarian-tools/src",
    "./apps/rpg-librarian/src",
    "./packages/rpg-librarian-mcp/tests",
    "./packages/rpg-librarian-tools/tests",
    "./apps/rpg-librarian/tests",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/rpg-librarian-mcp/tests",
    "packages/rpg-librarian-tools/tests",
    "apps/rpg-librarian/tests",
]
asyncio_mode = "auto"
filterwarnings = [
    # isbnlib imports pkg_resources, which warns; the library's, not ours to fix.
    "ignore:pkg_resources is deprecated:UserWarning",
]
addopts = "--basetemp=.pytest-tmp"
