[project]
name = "rpg-librarian-mcp"
version = "0.1.0"
description = "MCP server for organizing a digital RPG archive"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastmcp>=3.0",
    "httpx>=0.27",
    "isbnlib>=3.10.14",
    "jinja2>=3.1",
    "litellm>=1.60",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "pymediainfo>=7.0.1",
    "pymupdf>=1.28.0",
    "pypdfium2>=5.12.1",
    "pytesseract>=0.3.13",
    "python-barcode>=0.16.1",
    "python-dotenv>=1.0",
    "python-magic>=0.4.27",
    "pyyaml>=6.0",
    "requests>=2.32",
    "setuptools>=80.0,<82",  # isbnlib.registry does `from pkg_resources import ...`, removed in setuptools 82
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "trimesh>=4.12.2",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
rpg-librarian-mcp = "rpg_librarian_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_librarian_mcp"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.ty.environment]
root = ["./src", "./tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The sandbox denies writes under %TEMP%, where pytest puts tmp_path by
# default. Keep the temp root inside the project instead.
addopts = "--basetemp=.pytest-tmp"
