[project]
name = "rpg-librarian-mcp"
version = "0.1.0"
description = "MCP server exposing an RPG media library catalog to Claude Code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.1",
    "mcp>=1.28.1",
    "mutagen>=1.48.1",
    "networkx>=3.6.1",
    "pillow>=12.3.0",
    "pymediainfo>=7.0.1",
    "pymupdf>=1.28.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "trimesh>=4.12.2",
]

[project.scripts]
rpg-librarian-mcp = "rpg_librarian_mcp.server:main"
rpg-librarian-legacy-import = "rpg_librarian_mcp.legacy_import:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_librarian_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
