[project]
name = "rpg-librarian"
version = "0.1.0"
description = "Catalog-driven organizer for RPG content on a network share"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0",
    "rpg-librarian-tools",
]

[project.scripts]
rpg-librarian = "rpg_librarian.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_librarian"]

[tool.uv.sources]
rpg-librarian-tools = { workspace = true }
